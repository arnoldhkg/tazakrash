<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Сандық</title>
<style>
:root{
  --bg: #0f1724;
  --panel: #0b1220;
  --card: rgba(255,255,255,0.03);
  --muted: #9aa4b2;
  --accent: #4f46e5;
  --accent-600: #5b4ef5;
  --text: #e6eef8;
  --radius: 12px;
  --glass: rgba(255,255,255,0.02);
}
:root.light{
  --bg: #ffffff;
  --panel: #f5f5f5;
  --card: rgba(0,0,0,0.05);
  --muted: #555;
  --accent: #4f46e5;
  --accent-600: #5b4ef5;
  --text: #111;
  --glass: rgba(0,0,0,0.04);
}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter, Arial, sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--glass)}
.brand{display:flex;gap:12px;align-items:center}
.brand h1{font-size:16px;margin:0;font-weight:700}
.controls{display:flex;gap:8px;align-items:center}
.icon-btn{background:transparent;border:1px solid transparent;padding:8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--card)}
.wrap{display:flex;gap:14px;padding:14px;height:calc(100% - 68px);}
.sidebar{width:320px;background:var(--panel);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;overflow:auto}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search input{flex:1;padding:10px;border-radius:10px;border:none;background:var(--card);color:var(--text)}
.tabs-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 10px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
.tab.active{background:linear-gradient(90deg,var(--accent-600),var(--accent));color:white;border:1px solid rgba(0,0,0,0.12);}
.section-title{font-size:13px;color:var(--muted);margin:6px 0}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:transparent;border:1px solid transparent;cursor:pointer}
.lesson-item:hover{background:var(--card)}
.lesson-item.active{background:linear-gradient(90deg, rgba(91,78,245,0.12), rgba(79,70,229,0.06));border-left:4px solid var(--accent)}
.lesson-thumb{width:44px;height:34px;border-radius:6px;background:linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.1));display:flex;align-items:center;justify-content:center}
.lesson-title{font-weight:600;font-size:14px}
.lesson-meta{font-size:12px;color:var(--muted)}
.subject-list{display:flex;flex-direction:column;gap:10px}
.subject-card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;background:var(--card)}
.subject-card img{width:56px;height:40px;object-fit:cover;border-radius:8px}
.subject-name{font-weight:700}
.main{flex:1;overflow:auto}
.content{background:var(--panel);padding:18px;border-radius:var(--radius);min-height:200px}
.player-wrap{display:flex;gap:18px}
.player{flex:1;min-width:260px}
.preview{border-radius:12px;overflow:hidden;background:#000}
.preview iframe{width:100%;height:420px;border:0;display:block}
.side-info{width:360px}
.card{background:var(--card);padding:12px;border-radius:10px}
.small{font-size:13px;color:var(--muted);margin-top:8px}
#homeBtn{cursor:pointer;padding:6px 12px;border-radius:8px;background:var(--card);transition:0.18s}
#homeBtn:hover{background:var(--accent);color:#fff}
.logout-btn{cursor:pointer;padding:6px 12px;border-radius:8px;background:transparent;border:1px solid var(--glass);color:var(--muted)}
.logout-btn:hover{background:var(--card)}
/* mobile adjustments */
@media(max-width:900px){
  .wrap{flex-direction:column;padding:10px;height:calc(100% - 68px)}
  .sidebar{width:100%;order:2;padding:10px}
  .main{order:1}
  .player-wrap{flex-direction:column}
  .preview iframe{height:260px}
  .side-info{width:100%}
}
.tab, .lesson-item, .icon-btn{transition:all .18s ease}

/* ---- PASSWORD MODAL ---- */
#pwOverlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);z-index:9999;
}
#pwBox{
  background:var(--panel);padding:22px;border-radius:12px;width:360px;max-width:92%;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.04);
}
#pwBox h2{margin:0 0 8px;font-size:18px}
#pwBox p{margin:0 0 12px;color:var(--muted);font-size:13px}
#pwBox input{width:100%;padding:10px;border-radius:8px;border:none;background:var(--card);color:var(--text);margin-bottom:10px}
#pwBox .row{display:flex;gap:8px;justify-content:flex-end}
#pwBox button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer}
#pwError{color:#ff8686;font-size:13px;margin-top:6px;display:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <a id="homeBtn">Басты бет</a>
    <h1 id="pageTitle">Сандық</h1>
  </div>
  <div class="controls">
    <button id="themeToggle" class="icon-btn" title="Тақырыпты ауыстыру"></button>
    <button id="logoutBtn" class="logout-btn" title="Шығу" style="display:none">Шығу</button>
  </div>
</header>
<div class="wrap" id="app">
  <aside class="sidebar" id="sidebar">
    <!-- Subjects list (shown when no subject selected) -->
    <div id="subjectsView">
      <div class="section-title">Пәндер</div>
      <div id="subjectsList" class="subject-list"></div>
    </div>

    <!-- Subject detail controls (shown when a subject is selected) -->
    <div id="subjectDetail" style="display:none">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/></svg>
        <input id="searchInput" placeholder="Іздеу" />
      </div>

      <div class="section-title">Айлар</div>
      <div id="monthsTabs" class="tabs-row"></div>

      <div class="section-title">Апталар</div>
      <div id="weeksTabs" class="tabs-row"></div>

      <div class="section-title">Барлық сабақтар</div>
      <div id="lessons" class="lesson-list"></div>
    </div>
  </aside>

  <main class="main">
    <div class="content">
      <div class="player-wrap">
        <div class="player">
          <div id="videoTitle" style="font-size:18px;font-weight:700;margin-bottom:12px">Пән таңдаңыз</div>
          <div class="preview card" id="playerPreview" style="height:420px;display:flex;align-items:center;justify-content:center;color:var(--muted)">Плеер</div>
        </div>
        <aside class="side-info">
          <div class="card">
            <div style="font-weight:700">Сабаққа арналған материалдар</div>
            <div id="materialsList" class="small" style="margin-top:10px;color:var(--muted)">Мұнда PDF сілтемелері көрсетіледі.</div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>
<footer style="padding:10px 18px;color:var(--muted);font-size:13px"> ©JUZ40TAR</footer>

<!-- PASSWORD OVERLAY -->
<div id="pwOverlay" style="display:none">
  <div id="pwBox">

  /* ------- RENDERING LOGIC ------- */
  function renderSubjects(){
    subjectsList.innerHTML = '';
    state.subjects.forEach(s=>{
      const card = el('div',{class:'subject-card', 'data-id':s.id});
      const img = document.createElement('img'); img.src = s.icon || 'data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"160\" height=\"100\"></svg>';
      img.style.width='56px'; img.style.height='40px'; img.style.objectFit='cover'; img.style.borderRadius='8px';
      const nameWrap = el('div',{class:'subject-name', html:s.name});
      const wrapper = el('div',{style:'display:flex;gap:12px;align-items:center'});
      wrapper.appendChild(img); wrapper.appendChild(nameWrap);
      card.appendChild(wrapper);
      card.onclick = ()=>{ selectSubject(s.id); };
      subjectsList.appendChild(card);
    });
    // show subjects view
    subjectsView.style.display = '';
    subjectDetail.style.display = 'none';
    pageTitle.textContent = 'САНДЫҚ';
    videoTitle.textContent = 'Пән таңдаңыз';
    playerPreview.innerHTML = 'Плеер';
    materialsList.innerHTML = 'Мұнда PDF сілтемелері көрсетіледі.';
    logoutBtn.style.display = 'none';
  }

  function selectSubject(subjectId){
    current.subjectId = subjectId;
    const subj = state.subjects.find(x=>x.id===subjectId);
    current.monthId = subj?.months?.[0]?.id || null;
    current.weekId = subj?.months?.[0]?.weeks?.[0]?.id || null;
    current.lessonId = null;
    subjectsView.style.display = 'none';
    subjectDetail.style.display = '';
    pageTitle.textContent = subj.name;
    renderMonths(); renderWeeks(); renderLessons();
    logoutBtn.style.display = '';
  }

  function renderMonths(){
    monthsTabs.innerHTML = '';
    const subj = state.subjects.find(s=>s.id===current.subjectId);
    if(!subj) return;
    subj.months.forEach(m=>{
      const b = el('button',{class:'tab'+(current.monthId===m.id?' active':''), 'data-id':m.id, html:m.title});
      b.onclick = ()=>{ current.monthId = m.id; current.weekId = null; renderWeeks(); renderMonths(); renderLessons(); };
      monthsTabs.appendChild(b);
    });
    if(!current.monthId && subj.months.length){ current.monthId = subj.months[0].id; renderMonths(); }
  }

  function renderWeeks(){
    weeksTabs.innerHTML = '';
    const subj = state.subjects.find(s=>s.id===current.subjectId);
    if(!subj) return;
    const month = subj.months.find(m=>m.id===current.monthId);
    if(!month) return;
    month.weeks.forEach(w=>{
      const b = el('button',{class:'tab'+(current.weekId===w.id?' active':''), 'data-id':w.id, html:w.title});
      b.onclick = ()=>{ current.weekId = w.id; renderWeeks(); renderLessons(); };
      weeksTabs.appendChild(b);
    });
    if(!current.weekId && month.weeks.length){ current.weekId = month.weeks[0].id; renderWeeks(); }
  }

  // ---- updated renderLessons with PDF icon support ----
  function renderLessons(){
    lessonsEl.innerHTML = '';
    const subj = state.subjects.find(s=>s.id===current.subjectId);
    if(!subj) return;
    const month = subj.months.find(m=>m.id===current.monthId);
    if(!month) return;
    const week = month.weeks.find(w=>w.id===current.weekId);
    if(!week) return;

    // collect materials for right panel
    const materials = [];

    week.resources.forEach(r=>{
      const isPdf = (r.type && r.type.toLowerCase()==='pdf') || (typeof r.url==='string' && r.url.toLowerCase().endsWith('.pdf'));
      const icon = isPdf ? pdfIcon() : playIcon();
      const it = el('div',{class:'lesson-item','data-id':r.id});
      it.innerHTML = `<div class="lesson-thumb">${icon}</div><div style="flex:1"><div class="lesson-title">${r.title}</div></div>`;
      it.onclick = ()=>{ selectLesson(r); document.querySelectorAll('.lesson-item').forEach(x=>x.classList.remove('active')); it.classList.add('active'); };
      lessonsEl.appendChild(it);

      if(isPdf) materials.push(r);
    });
    // render materials list (right side)
    if(materials.length){
      materialsList.innerHTML = '';
      materials.forEach(m=>{
        const a = document.createElement('a');
        a.href = m.url;
        a.target = '_blank';
        a.textContent = '📄 ' + m.title;
        a.style.display = 'block';
        a.style.marginBottom = '8px';
        a.style.color = 'var(--muted)';
        materialsList.appendChild(a);
      });
    } else {
      materialsList.innerHTML = 'Бұл апталық материалдарда PDF жоқ.';
    }

    applySearch();
  }

  // changed selectLesson: if PDF -> show button linking to new tab; else iframe
  function selectLesson(r){
    current.lessonId = r.id;
    videoTitle.textContent = r.title;
    const isPdf = (r.type && r.type.toLowerCase()==='pdf') || (typeof r.url==='string' && r.url.toLowerCase().endsWith('.pdf'));

    if(isPdf){
      playerPreview.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;height:100%">
          <div style="font-weight:700">PDF материал</div>
          <a href="${r.url}" target="_blank" style="padding:10px 16px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;">PDF ашу</a>
        </div>
      `;
    } else {
      playerPreview.innerHTML = `<iframe src="${r.url}" allowfullscreen></iframe>`;
    }
  }

  // search filter
  function applySearch(){
    const q = (searchInput?.value || '').toLowerCase().trim();
    document.querySelectorAll('.lesson-item').forEach(node=>{
      const title = node.querySelector('.lesson-title').textContent.toLowerCase();
      node.style.display = title.includes(q) ? '' : 'none';
    });
  }
  searchInput?.addEventListener('input', applySearch);

  // HOME button -> show subjects
  homeBtn.addEventListener('click', ()=>{
    current.subjectId = null; current.monthId = null; current.weekId = null; current.lessonId = null;
    renderSubjects();
  });

  // LOGOUT button
  logoutBtn.addEventListener('click', ()=>{
    sessionStorage.removeItem(AUTH_KEY);
    showAuth(true);
  });

  /* ------------- AUTH / PASSWORD ------------- */
  function isAuthed(){ return sessionStorage.getItem(AUTH_KEY) === '1'; }

  function showAuth(show){
    if(show){
      pwOverlay.style.display = 'flex';
      pwInput.value = '';
      pwError.style.display = 'none';
    } else {
      pwOverlay.style.display = 'none';
    }
  }

  function tryAuth(val){
    if(!val) return false;
    if(val === SITE_PASSWORD){
      sessionStorage.setItem(AUTH_KEY,'1');
      showAuth(false);
      // initial render after auth
      renderSubjects();
      return true;
    } else {
      pwError.style.display = 'block';
      return false;
    }
  }

  pwSubmit.addEventListener('click', ()=>{ tryAuth(pwInput.value); });
  pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryAuth(pwInput.value); });

  // on load: check auth
  if(!isAuthed()){
    // hide page interaction until auth
    showAuth(true);
  } else {
    renderSubjects();
  }

  // expose for debug
  window.__JUZ_STATE = state;

})();
</script>
